
{% extends 'main/base.html' %}


{% block body %}
<div class="container">
    <h1 style="text-align: left; background-color: rgb(51, 192, 197) ; padding: 10px; border: 5px;">Sign up</h1>
    <form method="POST">
        {% csrf_token %}
        {{form.as_p}}
        <!-- <button type="submit">Submit</button> -->
        <input type="submit" value="Submit">
    </form>
    <p>Already have an account. <a href="{% url 'main:login' %}"><strong>Log in</strong></a> </p>
</div>


{% endblock  %}
