<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyWebapp</title>

    <!-- Compiled and minified CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">

    <!-- Compiled and minified JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>



</head>
<body>
    
   <nav style="background-color:#022b9c;">
    <div class="nav-wrapper">
    <div class="container">
      <a href="{%url 'main:homepage' %}" class="brand-logo">MySite</a>
      <ul id="nav-mobile" class="right hide-on-med-and-down">
        <li><a href="{%url 'main:homepage'%}">Home</a></li>
        <li><a href="#">ML</a></li>
        <li><a href="#">Wireless</a></li>
        {% if user.is_authenticated %}
        <li><a href="{% url 'main:login' %}">{{user.username}}</a></li>
        <li><a href="{% url 'main:logout' %}">Log out</a></li>

        {% else %}
        <li><a href="{% url 'main:login' %}">Log in</a></li>
        <li><a href="{% url 'main:signup' %}">Sign Up</a></li>
 
        {% endif %}    


      </ul>
    </div>
    </div>
  </nav>
    {% block body %}
    {% endblock  %}
   
    


            
</body>
</html>
